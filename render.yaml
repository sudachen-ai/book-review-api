# Render Blueprint: one free web service. Set the MYSQL_* secrets in the
# Render dashboard (Environment tab) after the first deploy.
services:
  - type: web
    name: book-review-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DB
        sync: false
      - key: MYSQL_SSL
        value: "1"
